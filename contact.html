<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contactez Quentin Pognant-Gros">
    <title>Contact | Quentin Pognant-Gros</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/logo/icône-de-moi.png">
</head>
<body>
    <header class="header">
        <a class="header__identity" href="index.html" aria-label="Accueil">
            <img class="header__logo" src="assets/logo/icône-de-moi.png" alt="icône du site">
        </a>
        <span class="header__name">Quentin Pognant-Gros</span>

        <button class="theme-toggle" type="button" aria-label="Activer le mode sombre">
            <img src="assets/UI/light-actif.png" alt="bouton changement de thème">
        </button>
    </header>
    <main class="contact-page">
        <section class="contact-container">
            <header class="contact__header">
                <span class="contact__diamond" aria-hidden="true">
                    <span></span>
                </span>

                <h1>Formulaire de contact</h1>
            </header>

            <form class="contact-form" action="#" method="post">
                <div class="contact-form__field">
                    <label for="name">Nom</label>
                    <input type="text" id="name" name="name" autocomplete="name" required>
                </div>

                <div class="contact-form__field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>

                <div class="contact-form__field">
                    <label for="phone">Téléphone <span class="contact-form__optional">(falcultatif)</span></label>
                    <input type="tel" id="phone" name="phone" autocomplete="tel">
                </div>

                <div class="contact-form__field">
                    <label for="msg">Message</label>
                    <textarea name="msg" id="msg" rows="7" required></textarea>
                </div>

                <div class="contact-form__actions">
                    <button class="contact-form__submit" type="submit">Envoyer</button>
                </div>
            </form>

            <section class="download-cv">
                <div class="download-cv__separator" aria-hidden="true">
                    <span></span>
                    <span class="download-cv__separator-diamond"></span>
                    <span></span>
                </div>

                <h2>Mon CV</h2>
                <p>Vous préférez le format traditionnel ?</p>
                <a class="download-cv__button" href="">Télécharger mon CV <span aria-hidden="true">↓</span></a>

            </section>
        </section>
    </main>
    
</body>
</html>

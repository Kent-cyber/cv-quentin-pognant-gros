<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CV de Quentin Pognant-Gros, Concepteur Développeur d'Applications"
    />
    <meta name="keyword" content="cv, développeur, concepteur, applications" />
    <title>Quentin Pognant-Gros | Concepteur Développeur d'Applications</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="assets/logo/icône-de-moi.png" />
  </head>
  <body>
    <header class="header">
      <a class="header__identity" href="index.html" aria-label="Accueil">
        <img
          class="header__logo"
          src="assets/logo/icône-de-moi.png"
          alt="icône du site"
        />
      </a>
      <span class="header__name">Quentin Pognant-Gros</span>

      <button
        class="theme-toggle"
        type="button"
        aria-label="Activer le mode sombre"
      >
        <img src="assets/UI/light-actif.png" alt="bouton changement de thème" />
      </button>
    </header>

    <main class="home">
      <section class="hero">
        <div class="portrait">
          <img
            class="portrait__photo"
            src="assets/artstation-kazuma-kiryu.jpg"
            alt="Photo de Quentin Pognant-Gros"
          />
          <img
            class="portrait__frame"
            src="assets/UI/cadre-photo-light.png"
            alt=""
          />
        </div>

        <h1 class="hero__title">Concepteur Développeur d'Applications</h1>
      </section>

      <section class="about">
        <div class="section-title">
          <span class="section-title__line"></span>
          <span class="section-title__diamond"></span>
          <h2 id="about-title">À propos</h2>
          <span class="section-title__diamond"></span>
          <span class="section-title__line"></span>
        </div>

        <p class="about__text">
          Développeur curieux et rigoureux avec un intérêt particulier pour les
          systèmes bien conçus et les interfaces utilisateurs soignées.
        </p>

        <a class="secondary-button" href="a-propos.html">En savoir plus</a>
      </section>

      <nav class="cv-navigation" aria-label="Découvrir mon parcours">
        <a
          class="cv-card cv-card--experiences"
          href="experiences.html"
          aria-label="Voir mes expériences professionnelles"
        >
          <img src="assets/cards/experiences-light.png" alt="" />
        </a>

        <a
          class="cv-card cv-card--formations"
          href="formations.html"
          aria-label="Voir mes formations"
        >
          <img src="assets/cards/formations-light.png" alt="" />
        </a>

        <a
          class="cv-card cv-card--passions"
          href="passions.html"
          aria-label="Découvrir mes passions"
        >
          <img src="assets/cards/passions-light.png" alt="" />
        </a>
      </nav>

      <section class="contact">
        <a
          class="contact__button"
          href="contact.html"
          aria-label="Me contacter"
        >
          <img src="assets/UI/bouton-contact-light.png" alt="" />
        </a>
      </section>
    </main>
  </body>
</html>
